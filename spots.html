<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sombra Spots | Advanced Microclimate</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <!-- Chart.js for Pro Analytics -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { margin: 0; padding: 0; display: flex; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; height: 100vh; background-color: #121212;}
        
        /* Pro Dark Mode Sidebar */
        #sidebar { 
            width: 400px; 
            background: #1e1e2d; 
            color: #e4e6ef; 
            padding: 25px; 
            box-shadow: 5px 0 15px rgba(0,0,0,0.5); 
            z-index: 1000; 
            overflow-y: auto;
            border-right: 1px solid #2b2b40;
        }
        
        #map { flex-grow: 1; background: #000; }
        
        .header-title { font-size: 1.5rem; font-weight: 700; color: #00a3ff; margin: 0 0 5px 0; letter-spacing: 1px;}
        .subtitle { color: #a1a5b7; font-size: 0.85rem; margin-top: 0; margin-bottom: 25px; text-transform: uppercase; letter-spacing: 1px;}
        
        /* Glassmorphism Data Cards */
        .data-card { 
            background: rgba(255, 255, 255, 0.03); 
            border: 1px solid rgba(255, 255, 255, 0.1); 
            border-radius: 8px; 
            padding: 15px; 
            margin-bottom: 20px; 
        }
        
        .data-card h4 { margin: 0 0 15px 0; font-size: 0.9rem; color: #a1a5b7; text-transform: uppercase;}
        
        /* Custom UI Controls */
        .legend-bar {
            height: 12px;
            background: linear-gradient(to right, #00b09b, #f1c40f, #e67e22, #e74c3c);
            border-radius: 6px;
            margin: 10px 0;
        }
        
        .legend-labels { display: flex; justify-content: space-between; font-size: 0.75rem; color: #a1a5b7;}
        
        .btn-pro { 
            background: #00a3ff; 
            color: white; 
            border: none; 
            padding: 12px; 
            width: 100%; 
            cursor: pointer; 
            border-radius: 6px; 
            font-weight: 600; 
            text-transform: uppercase; 
            letter-spacing: 1px;
            transition: all 0.3s; 
        }
        .btn-pro:hover { background: #008cdb; box-shadow: 0 0 15px rgba(0, 163, 255, 0.4); }

        /* Sleek Map Popups */
        .leaflet-popup-content-wrapper { background: #1e1e2d; color: #e4e6ef; border: 1px solid #2b2b40; border-radius: 8px;}
        .leaflet-popup-tip { background: #1e1e2d; }
        .popup-title { font-weight: bold; color: #00a3ff; border-bottom: 1px solid #2b2b40; padding-bottom: 5px; margin-bottom: 10px;}
    </style>
</head>
<body>

    <div id="sidebar">
        <h1 class="header-title">COOL SPOTS</h1>
        <p class="subtitle">Microclimate Analytics Dashboard</p>
        
        <div class="data-card">
            <h4>Live Surface Temp (LST) Map</h4>
            <div class="legend-bar"></div>
            <div class="legend-labels">
                <span>25°C (Cool)</span>
                <span>35°C</span>
                <span>45°C (Extreme)</span>
            </div>
        </div>

        <div class="data-card">
            <h4>District LST Trend (Last 5 Hrs)</h4>
            <canvas id="trendChart" height="150"></canvas>
        </div>

        <div class="data-card">
            <h4>Wind & Ventilation</h4>
            <p style="font-size: 0.85rem; color: #a1a5b7;">Enable vector simulation for urban canyon wind flows and cool breeze corridors.</p>
            <button class="btn-pro" onclick="alert('Simulating CFD Wind vectors...')">Run Wind Simulation</button>
        </div>
    </div>

    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // Initialize Map with a professional Dark Base (Carto Dark Matter)
        var map = L.map('map').setView([41.388, 2.165], 15);
        L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
            attribution: '&copy; CARTO'
        }).addTo(map);

        var gridLayer = L.layerGroup().addTo(map);

        // Procedural Dense Grid Generation (Simulating 400 analysis cells)
        var startLat = 41.378;
        var startLng = 2.155;
        var step = 0.0015; // Grid resolution

        for (var i = 0; i < 20; i++) {
            for (var j = 0; j < 20; j++) {
                var lat = startLat + (i * step);
                var lng = startLng + (j * step);
                
                // Simulate a thermal hotspot in the center
                var distFromCenter = Math.sqrt(Math.pow(10 - i, 2) + Math.pow(10 - j, 2));
                var temp = 45 - (distFromCenter * 1.5) + (Math.random() * 4 - 2); // Temp between ~25 and 45
                
                var color;
                if (temp < 30) color = '#00b09b'; // Cool Green
                else if (temp < 35) color = '#f1c40f'; // Yellow
                else if (temp < 40) color = '#e67e22'; // Orange
                else color = '#e74c3c'; // Danger Red

                var bounds = [[lat, lng], [lat + step, lng + step]];
                
                var popupHTML = `
                    <div class="popup-title">Grid Cell ID: ${i}x${j}</div>
                    <div style="font-size:13px; line-height: 1.8;">
                        <span style="color:#a1a5b7;">LST Temp:</span> <strong style="color:${color};">${temp.toFixed(1)}°C</strong><br>
                        <span style="color:#a1a5b7;">NDVI Score:</span> <strong>${(0.8 - (temp/60)).toFixed(2)}</strong><br>
                        <span style="color:#a1a5b7;">Albedo:</span> <strong>0.15</strong>
                    </div>
                `;

                L.rectangle(bounds, {
                    color: color,
                    weight: 0, // No border for heatmap look
                    fillOpacity: 0.45
                }).bindPopup(popupHTML).addTo(gridLayer);
            }
        }

        // Initialize Chart.js for professional analytics look
        var ctx = document.getElementById('trendChart').getContext('2d');
        var trendChart = new Chart(ctx, {
            type: 'line',
            data: {
                labels: ['12:00', '13:00', '14:00', '15:00', '16:00'],
                datasets: [{
                    label: 'Avg LST (°C)',
                    data: [32, 34, 37, 39, 36],
                    borderColor: '#00a3ff',
                    backgroundColor: 'rgba(0, 163, 255, 0.2)',
                    borderWidth: 2,
                    fill: true,
                    tension: 0.4
                }]
            },
            options: {
                plugins: { legend: { display: false } },
                scales: {
                    y: { grid: { color: '#2b2b40' }, ticks: { color: '#a1a5b7' } },
                    x: { grid: { display: false }, ticks: { color: '#a1a5b7' } }
                }
            }
        });
    </script>
</body>
</html>
